##
## Creates a Kinesis Firehose that accepts CloudTrail events from Kinesis and
## writes them as Parquet files on S3. Also creates a Glue table to access them.
##
## The Firehose and related resources are named after the stack.
##
## This Firehose uses a transformation Lambda to convert the raw event data to
## match the table definition. This template creates a "dummy" Lambda that you
## must then mandually update with source code from the "cloudtrail_firehose_transform"
## directory in this repository.
##
