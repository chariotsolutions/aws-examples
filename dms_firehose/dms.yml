##
## Creates the DMS infrastructure (endpoints, replication ## instance, and task)
## to perform change-data-capture on a Postgres database, writing to Kinesis.
##
## The connection information for the Postres server is provided in a Secrets
## Manager secret, using the standard RDS secret format.
##
## The replication instance configuration assumes that it will run in public
## subnets. If you want to pay NAT charges, provide private subnet IDs and
## disable the public IP address in the ReplicationInstance.
##
## The provided database security group will be updated with an ingress rule
## that allows connections from the replication instance.
##
